<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temp Tracker - Tu compañero climático</title>
    <link rel="stylesheet" href="./estilos.css" />
  </head>
  <body>
    <div class="contenedor">
      <div class="buscador">
        <input
          type="text"
          placeholder="Ingresa nombre de la ciudad"
          spellcheck="false"
          autocomplete="false"
          id="input-ciudad"
        />
        <button onclick="obtenerClima()">
          <img src="imagenes/buscar.png" alt="Icono de búsqueda" />
        </button>
      </div>

      <div class="clima-info">
        <img
          src="imagenes/clima_inicial.png"
          class="clima-icono"
          id="icono-clima"
        />
        <h1 class="temp" id="temp-valor">--°C</h1>
        <h2 class="ciudad" id="ciudad-nombre">Busca una ciudad</h2>

        <div class="detalles">
          <div class="col">
            <img src="imagenes/humedad.png" alt="Humedad" />
            <div>
              <p class="humedad" id="humedad-valor">--%</p>
              <p>Humedad</p>
            </div>
          </div>
          <div class="col">
            <img src="imagenes/viento.png" alt="Viento" />
            <div>
              <p class="viento" id="viento-valor">-- km/h</p>
              <p>Velocidad del Viento</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./codigo.js"></script>
  </body>
</html>
